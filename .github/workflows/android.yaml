name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: কোড নামানো
        uses: actions/checkout@v4

      - name: Java 17 বসানো
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: gradlew চালানোর অনুমতি
        run: chmod +x gradlew

      - name: Unit test চালানো
        run: ./gradlew testDebugUnitTest

      - name: Debug APK বানানো
        run: ./gradlew assembleDebug

      - name: APK সংরক্ষণ
        uses: actions/upload-artifact@v4
        with:
          name: todosync-app-debug
          path: app/build/outputs/apk/debug/*.apk
          
      - name: Secret test
        run: echo "todosync secret ${{secrets.TEST_SECRET}}"
        
      - name: Firebase CLI
        run: npm install -g firebase-tools

      - name: Service account creation
        env: 
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA_KEY" > "$RUNNER_TEMP/firebase-key.json"

      - name: sent Test build to testers
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: |
          firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --testers "yourmail@gmail.com" \
            --release-notes "GitHub Actions build number ${{ github.run_number }}"
